<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Pay with UPI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: linear-gradient(160deg,#1a1033,#3b1d5e); color: #fff; }
  .card { width: 92%; max-width: 380px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
          border-radius: 20px; padding: 26px 20px; text-align: center; }
  .crown { font-size: 40px; }
  h1 { font-size: 20px; margin: 8px 0 4px; letter-spacing: .5px; }
  .amt { font-size: 38px; font-weight: 800; margin: 10px 0 4px; }
  .sub { opacity: .75; font-size: 14px; margin-bottom: 20px; }
  .btn { display: block; width: 100%; border: 0; cursor: pointer; text-decoration: none; color: #fff;
         font-weight: 700; font-size: 16px; padding: 14px; border-radius: 14px; margin: 10px 0; font-family: inherit; }
  .main { background: linear-gradient(90deg,#f7b733,#fc4a1a); font-size: 18px; }
  .gpay { background: #1a73e8; } .phonepe { background: #5f259f; } .paytm { background: #00b9f1; }
  .note { font-size: 12.5px; opacity: .7; margin-top: 16px; line-height: 1.5; }
  .err { color: #ffb4b4; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="crown">👑</div>
  <h1>VIP MEMBERSHIP</h1>
  <div class="amt" id="amt">₹—</div>
  <div class="sub" id="plan">Choose how you want to pay</div>
  <button class="btn main" id="pay" type="button" data-app="upi">💳 Pay with any UPI App</button>
  <button class="btn gpay" id="gpay" type="button" data-app="gpay">Google Pay</button>
  <button class="btn phonepe" id="phonepe" type="button" data-app="phonepe">PhonePe</button>
  <button class="btn paytm" id="paytm" type="button" data-app="paytm">Paytm</button>
  <div class="note" id="note">Tap a button — your UPI app will open to pay.<br>After paying, come back to the bot and send the <b>12-digit UTR</b> or a <b>payment screenshot</b>.</div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var pa = q.get("pa") || "", pn = q.get("pn") || "VIP", am = q.get("am") || "", tn = q.get("tn") || "VIP";
  var isExt = q.get("ext") === "1";          // ONLY the external browser copy opens UPI apps
  var wantApp = q.get("app") || "upi";
  var okPa = /^[A-Za-z0-9._-]{2,256}@[A-Za-z0-9.-]{2,64}$/.test(pa);
  var okAm = /^\d{1,6}(\.\d{1,2})?$/.test(am);
  if (!okPa || !okAm) {
    document.getElementById("card").innerHTML = '<div class="crown">⚠️</div><h1 class="err">Invalid payment link</h1><div class="note">Please go back to the bot and tap Pay again.</div>';
    return;
  }
  var qs = "pa=" + encodeURIComponent(pa) + "&pn=" + encodeURIComponent(pn.slice(0, 40)) +
           "&am=" + encodeURIComponent(am) + "&cu=INR&tn=" + encodeURIComponent(tn.slice(0, 50));
  var links = {
    upi: "upi://pay?" + qs,
    gpay: "tez://upi/pay?" + qs,
    phonepe: "phonepe://pay?" + qs,
    paytm: "paytmmp://pay?" + qs
  };
  document.getElementById("amt").textContent = "₹" + am;
  document.getElementById("plan").textContent = tn.slice(0, 50);
  var ids = ["pay", "gpay", "phonepe", "paytm"];

  if (isExt) {
    // ---------- Phone browser (Chrome): UPI links work here ----------
    ids.forEach(function (id) {
      var el = document.getElementById(id);
      el.addEventListener("click", function () { location.href = links[el.getAttribute("data-app")]; });
    });
    document.getElementById("note").innerHTML = "Your UPI app should open now. If not, tap a button above.<br>After paying, go back to the bot and send the <b>12-digit UTR</b> or a <b>payment screenshot</b>.";
    setTimeout(function () { location.href = links[wantApp] || links.upi; }, 300);
    return;
  }

  // ---------- Inside Telegram (or anywhere else): never touch upi:// here ----------
  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  try { if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor("#1a1033"); tg.setBackgroundColor("#1a1033"); } } catch (e) {}
  var base = location.href.split("#")[0];
  var openOutside = function (app) {
    var url = base + (base.indexOf("?") >= 0 ? "&" : "?") + "ext=1&app=" + encodeURIComponent(app || "upi") + "&t=" + Date.now();
    var done = false;
    try { if (tg && tg.openLink) { tg.openLink(url); done = true; } } catch (e) {}
    if (!done) { try { window.open(url, "_blank"); } catch (e) {} }
  };
  ids.forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener("click", function () { openOutside(el.getAttribute("data-app")); });
  });
  try {
    if (tg && tg.MainButton) {
      tg.MainButton.setParams({ text: "💳 PAY ₹" + am + " NOW", color: "#fc4a1a", text_color: "#ffffff" });
      tg.MainButton.show();
      tg.MainButton.onClick(function () { openOutside("upi"); });
    }
  } catch (e) {}
})();
</script>
</body>
</html>
