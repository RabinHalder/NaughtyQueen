<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pay with UPI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: linear-gradient(160deg,#1a1033,#3b1d5e); color: #fff; }
  .card { width: 92%; max-width: 380px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
          border-radius: 20px; padding: 26px 20px; text-align: center; }
  .crown { font-size: 40px; }
  h1 { font-size: 20px; margin: 8px 0 4px; letter-spacing: .5px; }
  .amt { font-size: 38px; font-weight: 800; margin: 10px 0 4px; }
  .sub { opacity: .75; font-size: 14px; margin-bottom: 20px; }
  .btn { display: block; width: 100%; border: 0; cursor: pointer; text-decoration: none; color: #fff;
         font-weight: 700; font-size: 16px; padding: 14px; border-radius: 14px; margin: 10px 0; font-family: inherit; }
  .main { background: linear-gradient(90deg,#f7b733,#fc4a1a); font-size: 18px; }
  .gpay { background: #1a73e8; } .phonepe { background: #5f259f; } .paytm { background: #00b9f1; }
  .note { font-size: 12.5px; opacity: .7; margin-top: 16px; line-height: 1.5; }
  .err { color: #ffb4b4; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="crown">👑</div>
  <h1>VIP MEMBERSHIP</h1>
  <div class="amt" id="amt">₹—</div>
  <div class="sub" id="plan">Choose how you want to pay</div>
  <a class="btn main" id="pay" href="#" data-app="upi">💳 Pay with any UPI App</a>
  <a class="btn gpay" id="gpay" href="#" data-app="gpay">Google Pay</a>
  <a class="btn phonepe" id="phonepe" href="#" data-app="phonepe">PhonePe</a>
  <a class="btn paytm" id="paytm" href="#" data-app="paytm">Paytm</a>
  <div class="note" id="note">After paying, go back to the bot and send the <b>12-digit UTR</b> or a <b>payment screenshot</b>.<br>If the app does not open, scan the QR in the bot.</div>
</div>
<script>
(function () {
  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  // Real Telegram Mini App = Telegram passes init data / a known platform
  var inTg = !!(tg && ((tg.initData && tg.initData.length) || (tg.platform && tg.platform !== "unknown")));

  var q = new URLSearchParams(location.search);
  var pa = q.get("pa") || "", pn = q.get("pn") || "VIP", am = q.get("am") || "", tn = q.get("tn") || "VIP";
  var wantApp = q.get("app") || "";
  var okPa = /^[A-Za-z0-9._-]{2,256}@[A-Za-z0-9.-]{2,64}$/.test(pa);
  var okAm = /^\d{1,6}(\.\d{1,2})?$/.test(am);
  if (!okPa || !okAm) {
    document.getElementById("card").innerHTML = '<div class="crown">⚠️</div><h1 class="err">Invalid payment link</h1><div class="note">Please go back to the bot and tap Pay again.</div>';
    return;
  }
  var qs = "pa=" + encodeURIComponent(pa) + "&pn=" + encodeURIComponent(pn.slice(0, 40)) +
           "&am=" + encodeURIComponent(am) + "&cu=INR&tn=" + encodeURIComponent(tn.slice(0, 50));
  var links = {
    upi: "upi://pay?" + qs,
    gpay: "tez://upi/pay?" + qs,
    phonepe: "phonepe://pay?" + qs,
    paytm: "paytmmp://pay?" + qs
  };
  document.getElementById("amt").textContent = "₹" + am;
  document.getElementById("plan").textContent = tn.slice(0, 50);

  var btns = ["pay", "gpay", "phonepe", "paytm"];

  if (inTg) {
    // ---- Inside Telegram: the in-app window cannot open upi:// (ERR_UNKNOWN_URL_SCHEME).
    // Open this same page in the phone's browser, which then opens the UPI app.
    try { tg.ready(); tg.expand(); tg.setHeaderColor("#1a1033"); tg.setBackgroundColor("#1a1033"); } catch (e) {}
    var base = location.href.split("#")[0];
    var openOutside = function (app) {
      var url = base + (base.indexOf("?") >= 0 ? "&" : "?") + "ext=1&app=" + encodeURIComponent(app || "upi");
      try { tg.openLink(url); } catch (e) {}
    };
    btns.forEach(function (id) {
      var el = document.getElementById(id);
      el.removeAttribute("href");
      el.addEventListener("click", function (ev) { ev.preventDefault(); openOutside(el.getAttribute("data-app")); });
    });
    try {
      tg.MainButton.setParams({ text: "💳 PAY ₹" + am + " NOW", color: "#fc4a1a", text_color: "#ffffff" });
      tg.MainButton.show();
      tg.MainButton.onClick(function () { openOutside("upi"); });
    } catch (e) {}
    document.getElementById("note").innerHTML = "Tap a button — your UPI app will open to pay.<br>After paying, come back to the bot and send the <b>12-digit UTR</b> or a <b>payment screenshot</b>.";
    return;
  }

  // ---- In the phone's browser: real UPI links work here.
  btns.forEach(function (id) {
    var el = document.getElementById(id);
    el.href = links[el.getAttribute("data-app")];
  });
  var target = links[wantApp] || links.upi;
  setTimeout(function () { try { location.href = target; } catch (e) {} }, 300);
})();
</script>
</body>
</html>
